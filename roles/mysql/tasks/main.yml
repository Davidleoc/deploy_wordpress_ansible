---
    - name: Install dependencias in node 2
      apt:
        pkg:
        - mysql-server
        - python3-pymysql
        state: latest
        update_cache: yes
    - name: crete a new database
      mysql_db:
        name: '{{ wp_db_name }}'
        state: present
        login_unix_socket: /run/mysqld/mysqld.sock 
    - name: create a new user with password and grant privileges
      mysql_user:
        name: '{{  wp_db_user }}'
        password: '{{  wp_db_pass }}'
        priv: '{{ wp_db_name }}.*:SELECT,INSERT,UPDATE,DELETE, CREATE, DROP, ALTER'
        state: present
        login_unix_socket: /run/mysqld/mysqld.sock
        host: '{{ item }}'
      with_items:
      - 'localhost'
      - '127.0.0.1'
      - '{{ wp_ip }}' # IP do servidor do Wordpress
    - name: configure database to accept external connections
      replace:
        path: /etc/mysql/mysql.conf.d/mysqld.cnf
        regexp: "127.0.0.1"
        replace: "0.0.0.0"
      notify: 
      - restart mysql